name: VISION360 Generator (local-only)

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: write

jobs:
  vision360_generator:
    name: VISION360 generator (local-only)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare /mnt/data
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/data
          sudo chmod 777 /mnt/data

      - name: Prepare embedded VISION360 configuration
        shell: bash
        run: |
          set -euo pipefail

          config_dir="$RUNNER_TEMP/vision360-config"
          mkdir -p "$config_dir"

          cat > "$config_dir/vision360.defaults.yml" <<'JSON'
          {
            "schema_version": 1,
            "source_label": "SOURCE_CODE_REPOSITORY",
            "project": {
              "name": "Portable Vision360 Project"
            },
            "inputs": {
              "mobsf_static_zip": "mobsf-report.zip",
              "mobsf_dynamic_zip": "mobsf-dynamic-report.zip",
              "source_zip": "openMRS.zip",
              "sast_zip": "sast-findings.zip",
              "trivy_zip": "trivy-payload.zip"
            },
            "metadata_overrides": {
              "titles": {
                "has_android_insecure_random_rng": "Uses Insecure Random Number Generator",
                "has_exported_broadcast_receivers_without_permission": "Exported Broadcast Receivers Without Permission"
              },
              "descriptions": {
                "has_android_insecure_random_rng": "Detects insecure random number generator usage, typically reported by MobSF.",
                "has_exported_broadcast_receivers_without_permission": "Detects any exported receiver without permission protection."
              },
              "rationales": {
                "has_android_insecure_random_rng": "Weak RNG can break cryptographic guarantees.",
                "has_exported_broadcast_receivers_without_permission": "Exported receivers without permission can allow intent spoofing and unauthorized invocation."
              },
              "primary_sources": {
                "has_android_insecure_random_rng": ["MobSF_STATIC"],
                "has_exported_broadcast_receivers_without_permission": ["SOURCE_CODE_REPOSITORY"]
              }
            },
            "classification": {
              "positive_flags": [
                "has_tls_ssl_pinning_implemented",
                "has_ssl_cert_pinning_implemented",
                "has_android_ssl_pinning_present",
                "has_android_ssl_pinning_detected",
                "has_supports_runtime_permission_management",
                "has_os_time_source",
                "has_manifest_services_explicit_accessibility_attributes",
                "has_password_hashing_uses_salts",
                "has_password_hashing_uses_kdf",
                "has_secure_cicd_key_management",
                "has_secrets_secure_keystore_env_vars",
                "has_signing_creds_not_hardcoded",
                "has_supports_manual_logout",
                "has_clears_local_session_data_on_logout",
                "has_clears_cookies_on_logout",
                "has_session_id_assigned_from_server_cookie",
                "has_logout_invalidates_server_session",
                "has_endpoint_requires_user_authentication",
                "has_manifest_custom_permission_defined",
                "has_permissions_protected_with_signature_level",
                "has_prevention_against_reverse_engineering"
              ],
              "negative_flags": [
                "has_hardcoded_credentials",
                "has_android_debuggable_enabled",
                "has_manifest_debuggable_true",
                "has_manifest_backup_enabled",
                "has_manifest_allow_clear_text_traffic_true",
                "has_manifest_exports_components_insecurely",
                "has_exported_broadcast_receivers_without_permission",
                "has_release_minify_disabled",
                "has_android_read_write_external_storage",
                "has_android_extra_risky_permissions_present",
                "has_android_insecure_random_rng"
              ]
            },
            "manifest_scoring": {
              "application_weight": 1000,
              "service_weight": 50,
              "activity_weight": 20,
              "path_bonus_tokens": [
                {"token": "app/", "weight": 150},
                {"token": "android", "weight": 10}
              ]
            },
            "detectors": {
              "os_time_source": {
                "preferred_evidence": [],
                "preferred_path_hints": [],
                "patterns": [
                  {"rule_id": "System.currentTimeMillis", "regex": "\\bSystem\\.currentTimeMillis\\s*\\("},
                  {"rule_id": "SystemClock.elapsedRealtime", "regex": "\\bSystemClock\\.elapsedRealtime\\s*\\("},
                  {"rule_id": "SystemClock.uptimeMillis", "regex": "\\bSystemClock\\.uptimeMillis\\s*\\("},
                  {"rule_id": "Instant.now", "regex": "\\bInstant\\.now\\s*\\("},
                  {"rule_id": "LocalDateTime.now", "regex": "\\bLocalDateTime\\.now\\s*\\("},
                  {"rule_id": "Calendar.getInstance", "regex": "\\bCalendar\\.getInstance\\s*\\("},
                  {"rule_id": "new Date", "regex": "\\bnew\\s+Date\\s*\\("},
                  {"rule_id": "OffsetDateTime.now", "regex": "\\bOffsetDateTime\\.now\\s*\\("},
                  {"rule_id": "ZonedDateTime.now", "regex": "\\bZonedDateTime\\.now\\s*\\("},
                  {"rule_id": "DateUtils.convertTime(System.currentTimeMillis)", "regex": "\\bconvertTime\\s*\\(\\s*System\\.currentTimeMillis\\s*\\("}
                ]
              },
              "password_hashing": {
                "preferred_path_hints": [],
                "kdf_patterns": [
                  {"algorithm": "bcrypt", "regex": "\\bBCrypt\\s*\\.\\s*hashpw\\s*\\("},
                  {"algorithm": "bcrypt", "regex": "\\bBCrypt\\s*\\.\\s*gensalt\\s*\\("},
                  {"algorithm": "pbkdf2", "regex": "PBKDF2WithHmacSHA\\d+"},
                  {"algorithm": "pbkdf2", "regex": "\\bSecretKeyFactory\\s*\\.\\s*getInstance\\s*\\(\\s*\\\"PBKDF2"},
                  {"algorithm": "scrypt", "regex": "\\bscrypt\\b"},
                  {"algorithm": "argon2", "regex": "\\bargon2\\b"},
                  {"algorithm": "bcrypt", "regex": "\\bBCryptPasswordEncoder\\b"},
                  {"algorithm": "pbkdf2", "regex": "\\bPBEKeySpec\\b"}
                ],
                "salt_patterns": [
                  {"algorithm": "bcrypt_salt", "regex": "\\bBCrypt\\s*\\.\\s*gensalt\\s*\\("},
                  {"algorithm": "salt_var", "regex": "\\bsalt\\s*=\\s*"},
                  {"algorithm": "secure_random_salt", "regex": "\\bSecureRandom\\b.*\\bnextBytes\\s*\\("}
                ]
              },
              "logout_session": {
                "path_hints": [],
                "logout_method_patterns": ["void logout\\s*\\(", "public void logout\\s*\\(", "\\bshowLogoutDialog\\s*\\("],
                "local_cleanup_patterns": ["clearuserpreferencesdata\\s*\\(", "clear.*session", "clear.*preferences", "logout.*clear", "\\bremove\\s*\\(\\s*ApplicationConstants\\.[A-Za-z0-9_\\.]+\\s*\\)", "\\bmoveToLoginActivity\\s*\\("],
                "cookie_cleanup_patterns": ["removeallcookies", "clearcookies", "CookieManager\\.getInstance\\(\\)\\.removeAllCookies", "\\bdeleteAllCookies\\b", "\\bclearCookie[s]?\\b"],
                "session_cookie_patterns": ["jsessionid", "sessionid", "CookieManager\\.getInstance\\(\\)\\.setCookie", "CookieHandler\\.setDefault"],
                "logout_endpoint_patterns": ["\\\"/logout\\\"", "'/logout'"]
              },
              "endpoint_auth": {
                "path_hints": [],
                "basic_auth_patterns": ["\\.header\\(\\s*\\\"Authorization\\\"\\s*,\\s*basic\\s*\\)", "Basic\\s+[A-Za-z0-9+/=]+", "\\.addHeader\\(\\s*\\\"Authorization\\\"\\s*,", "setRequestProperty\\(\\s*\\\"Authorization\\\"\\s*,"],
                "any_authorization_patterns": ["\\\"Authorization\\\"", "authorization\\s*:", "bearer", "basic", "\\.addHeader\\(\\s*\\\"Authorization\\\"", "setRequestProperty\\(\\s*\\\"Authorization\\\"", "\\baddNetworkInterceptor\\b", "\\baddInterceptor\\b"]
              },
              "signing": {
                "gradle_file_extensions": [".gradle", ".gradle.kts"],
                "env_var_names": ["KEYSTORE_PASSWORD", "KEYSTORE_ALIAS_NAME", "KEYSTORE_ALIAS_PASS"]
              },
              "permissions": {
                "special_os_permissions": [
                  "android.permission.WRITE_SETTINGS",
                  "android.permission.WRITE_SECURE_SETTINGS",
                  "android.permission.SYSTEM_ALERT_WINDOW",
                  "android.permission.REQUEST_INSTALL_PACKAGES",
                  "android.permission.MANAGE_EXTERNAL_STORAGE"
                ],
                "risky_permissions": [
                  "android.permission.READ_EXTERNAL_STORAGE",
                  "android.permission.WRITE_EXTERNAL_STORAGE",
                  "android.permission.MANAGE_EXTERNAL_STORAGE",
                  "android.permission.CAMERA",
                  "android.permission.RECORD_AUDIO",
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.READ_CONTACTS",
                  "android.permission.WRITE_CONTACTS",
                  "android.permission.READ_SMS",
                  "android.permission.RECEIVE_SMS",
                  "android.permission.SEND_SMS",
                  "android.permission.READ_CALL_LOG",
                  "android.permission.WRITE_CALL_LOG",
                  "android.permission.READ_PHONE_STATE",
                  "android.permission.SYSTEM_ALERT_WINDOW",
                  "android.permission.REQUEST_INSTALL_PACKAGES",
                  "android.permission.WRITE_SETTINGS",
                  "android.permission.WRITE_SECURE_SETTINGS"
                ]
              }
            },
            "org_flag_patterns": {}
          }
          JSON

          cat > "$config_dir/vision360.groups.json" <<'JSON'
          [
            {"id":"ORG","title":"Organizational & Governance","description":"Políticas, estándares y procesos organizacionales relacionados con seguridad y privacidad.","flags":["has_org_policy_embedding_data_type","has_org_api_responses_schema","has_org_client_processing_policy","has_defined_password_policy","has_defined_account_lock_policy","has_defined_session_timeout_policy","has_defined_rbac_model","has_defined_authorization_policy","has_defined_identity_lifecycle_policy","has_defined_privilege_management_policy","has_defined_log_retention_policy","has_defined_log_review_process","has_defined_key_rotation_policy","has_defined_key_revocation_process","has_defined_certificate_management_policy","has_defined_secrets_management_policy","has_defined_api_key_rotation_policy","has_policy_documentation_gaps","has_org_has_formal_security_testing_program","has_org_runs_static_analysis_in_cicd","has_org_runs_pentest_before_production","has_org_runs_periodic_security_assessments","has_org_tracks_security_findings_to_closure","has_org_requires_secure_code_review_for_critical_releases","has_org_has_threat_model_for_mobile_app","has_org_has_binary_protection_policy","has_org_has_formal_patch_management_policy","has_org_notifies_users_of_security_updates","has_org_registers_admin_for_security_alerts","has_org_tracks_component_vulnerabilities","has_org_documents_security_updates","has_org_app_deprecation_policy","has_org_app_deprecation_user_notification_process","has_org_app_deprecation_communication_plan","has_org_requires_fips_validated_crypto_for_sensitive_data","has_org_requires_nist_approved_key_management","has_org_requires_dod_approved_ca_for_tls","has_org_has_crypto_key_lifecycle_policy","has_org_password_policy_meets_stig_requirements","has_org_account_lockout_policy_meets_stig_requirements","has_org_session_timeout_policy_meets_stig_requirements","has_device_access_policy_enforced","has_org_log_retention_at_least_one_year","has_org_log_retention_at_least_five_years_for_sami","has_org_has_audit_reporting_and_forensic_procedures","has_org_supports_audit_reduction_and_filtering","has_org_protects_audit_log_integrity_cryptographically","has_org_protects_audit_tools_and_log_access","has_org_validates_audit_tool_integrity_periodically","has_org_notifies_isso_on_audit_failures","has_org_has_emergency_access_procedure_for_ephi","has_org_logs_and_reviews_emergency_access_events","has_org_has_data_classification_policy","has_org_has_data_retention_policy_for_pii_phi","has_org_minimizes_pii_collection_by_design","has_org_has_formal_privacy_notice_and_consent_process","has_org_has_device_loss_response_process","has_org_monitors_resource_exhaustion_and_alerts_admins","has_org_has_incident_response_plan_for_app","has_org_has_data_recovery_and_backup_for_ephi","has_org_notifies_admin_on_account_lifecycle_events","has_org_has_formal_account_lifecycle_process","has_org_complies_with_ficam_profiles"]},
            {"id":"SECRETS","title":"Secrets & Credentials","description":"Gestión de secretos, credenciales, API keys y signing keys.","flags":["has_hardcoded_credentials","has_secrets_secure_keystore_env_vars","has_signing_creds_not_hardcoded","has_exposes_signing_keys_in_source_or_ci","has_api_keys_in_version_control","has_env_specific_api_credentials_configured","has_secure_cicd_key_management","has_ci_cd_uses_encrypted_keys","has_secrets_generic_found","has_secrets_count","has_uses_os_level_update_mechanisms"]},
            {"id":"TLS","title":"TLS & Network Security","description":"Seguridad de transporte, configuración de TLS y protección frente a MITM.","flags":["has_tls_ssl_pinning_implemented","has_ssl_cert_pinning_implemented","has_ssl_pinning_findings_severity_good","has_android_ssl_pinning_present","has_android_ssl_pinning_detected","has_network_security_config_present","has_https_with_cert_pinning","has_approved_ports_and_protocols","has_os_time_source","has_backend_replay_protection","has_backend_has_dos_protection_and_rate_limiting","has_backend_is_deployed_with_redundancy_for_ha","has_dos_vulnerabilities","has_soap_uses_tls","has_soap_uses_mutual_tls"]},
            {"id":"CRYPTO","title":"Cryptography","description":"Uso de criptografía, certificados y parámetros criptográficos.","flags":["has_cert_signed_with_code_signing_cert","has_cert_v1_signature_present_janus_risk","has_cert_signed_with_debug_certificate","has_cert_uses_sha1_signature_algorithm","has_cert_x509_subject_android_debug","has_cert_validity_long_term","has_os_secure_key_storage","has_client_side_crypto_for_sensitive_data","has_android_insecure_random_rng"]},
            {"id":"AUTH","title":"Authentication & Authorization","description":"Autenticación, autorización y protección de tokens.","flags":["has_sensitive_data_encrypted_with_os_keystore","has_auth_keys_stored_in_secure_hardware","has_oauth2_authentication","has_jwt_tokens","has_token_based_auth","has_sso_mechanisms","has_rbac_enforced_on_api","has_server_side_authz_for_sensitive_actions","has_server_side_authz_enforced","has_endpoint_requires_user_authentication","has_access_tokens_weak_or_unpredictable","has_backend_token_validation","has_backend_rbac_enforcement","has_iaa_supports_mfa_for_privileged_accounts","has_iaa_supports_mfa_for_sensitive_ephi_access"]},
            {"id":"SESSION","title":"Session Management","description":"Gestión de sesiones, logout y lifecycle de credenciales.","flags":["has_iaa_supports_out_of_band_authentication","has_iaa_enforces_account_lifecycle_controls","has_session_ids_reused","has_logout_invalidates_server_session","has_clears_local_session_data_on_logout","has_clears_auth_data_on_logout","has_session_id_assigned_from_server_cookie","has_supports_manual_logout"]},
            {"id":"INPUT_OUTPUT","title":"Input/Output Validation","description":"Validación y sanitización de datos de entrada/salida.","flags":["has_clears_cookies_on_logout","has_backend_input_validation"]},
            {"id":"LOGGING","title":"Logging & Monitoring","description":"Registro de eventos, auditoría y monitorización.","flags":["has_data_format_strictly_controlled","has_log_input_sanitization_present","has_log_injection_vulnerabilities","has_logs_privileged_actions_with_timestamp","has_error_messages_disclose_internal_details","has_error_messages_are_generic","has_error_messages_sent_to_unauthorized_destinations","has_server_side_audit_trail","has_secure_backend_log_storage","has_audit_event_correlation","has_audit_failure_alerting"]},
            {"id":"BINARY","title":"Binary Hardening & Malware","description":"Endurecimiento del binario, certificados y malware.","flags":["has_logs_offloaded_to_secure_siem","has_malware_detections","has_min_sdk_below_security_baseline","has_target_sdk_below_security_baseline","has_modern_android_security_baseline","has_protection_against_tampered_executables","has_controls_protecting_temporary_compiled_data","has_temporary_compiled_data_securely_deleted","has_android_debuggable_enabled","has_manifest_debuggable_true","has_manifest_backup_enabled","has_manifest_allow_clear_text_traffic_true","has_manifest_exports_components_insecurely","has_manifest_services_explicit_accessibility_attributes","has_manifest_custom_permission_defined","has_prevention_against_reverse_engineering"]},
            {"id":"DEPENDENCIES","title":"Dependencies & Backend Resilience","description":"Dependencias de terceros y resiliencia del backend.","flags":["has_android_dynamic_code_loading","has_libraries_stored_in_secure_app_dir","has_backend_policy_dependencies","has_sast_security_findings","has_codeql_security_findings","has_semgrep_security_findings","has_sast_high_confidence_security_findings","has_sast_quality_only_findings","has_buffer_overflow_vulnerabilities","has_race_condition_vulnerabilities"]},
            {"id":"SCA","title":"Software Composition Analysis","description":"Vulnerabilidades conocidas, inventario de dependencias, disponibilidad de correcciones y exposición de licencias detectadas mediante Trivy.","flags":["has_sca_dependency_inventory","has_sca_known_vulnerable_dependencies","has_sca_critical_vulnerabilities","has_sca_high_vulnerabilities","has_sca_medium_vulnerabilities","has_sca_low_vulnerabilities","has_sca_fixable_vulnerabilities","has_sca_unfixed_vulnerabilities","has_sca_security_sensitive_outdated_libraries","has_sca_license_inventory","has_sca_restrictive_licenses","has_sca_unknown_licenses"]},
            {"id":"ROBUSTNESS","title":"Robustness & Memory Safety","description":"Robustez, condiciones de carrera y seguridad de memoria.","flags":["has_out_of_bounds_vulnerabilities","has_memory_corruption_vulnerabilities","has_integer_arithmetic_vulnerabilities","has_null_pointer_protection_implemented","has_initializes_params_on_startup","has_fails_safe_on_init_failure","has_runtime_global_kill_switch_for_security_incidents","has_safe_mode_degraded_functionality_design","has_workmanager_for_resilient_network_tasks","has_transaction_recovery_logs","has_ipc_bindservice_secure","has_requests_only_minimum_permissions","has_supports_runtime_permission_management"]},
            {"id":"IPC_PERMS","title":"Android IPC & Permissions","description":"IPC, permisos y exposición de componentes.","flags":["has_permissions_protected_with_signature_level","has_content_provider_actively_exposed","has_exported_broadcast_receivers_without_permission","has_android_read_write_external_storage","has_webview_components","has_webview_javascript","has_webview_addjavascriptinterface_present","has_webview_javascript_interface_limited_to_trusted_content","has_webview_javascript_interface_exposes_sensitive_functionality","has_webview_javascript_interface_leaks_sensitive_data","has_webview_remote_content","has_webview_file_scheme","has_insecure_http_based_webview_communication","has_displays_sensitive_data_unmasked","has_ui_data_masking","has_blocks_screenshots_flag_secure","has_clears_ui_on_background"]},
            {"id":"WEBVIEW","title":"WebView & Remote Content","description":"Uso de WebViews, notificaciones y canales de exposición.","flags":["has_secure_notifications","has_notification_leaks_sensitive_data","has_notification_uses_public_channels","has_third_party_trackers","has_crash_reporting_tracker","has_analytics_tracker","has_privacy_relevant_tracker"]},
            {"id":"UI_PRIVACY","title":"UI / Storage / Privacy UX","description":"Tratamiento de datos sensibles en UI y almacenamiento local.","flags":["has_stores_sensitive_data_on_device","has_uses_encrypted_local_database","has_uses_encrypted_shared_preferences","has_uses_encrypted_filesystem_storage","has_stores_pii_in_plaintext","has_stores_auth_tokens_in_plaintext","has_stores_keys_in_plaintext","has_clears_local_data_on_uninstall","has_clears_local_data_on_logout_or_switch_user","has_local_caching_of_ephi","has_encrypted_local_caching_of_ephi","has_stores_ephi_on_external_storage","has_sends_ephi_to_third_party_services","has_uses_push_notifications_for_ephi","has_uses_secure_push_channel_for_ephi","has_supports_patient_consent_workflows","has_supports_patient_data_export","has_supports_patient_data_deletion","has_enforces_data_minimization_on_client","has_secure_sync_for_offline_ephi","has_collects_telemetry_for_security_events","has_dynamic_runtime_evidence","has_dynamic_tls_evidence","has_dynamic_storage_evidence","has_dynamic_session_evidence","has_dynamic_http_traffic_detected","has_android_extra_risky_permissions_present","has_password_hashing_uses_salts","has_password_hashing_uses_kdf"]},
            {"id":"SOAP_SAML","title":"SOAP / SAML / Enterprise Security","description":"Integraciones SOAP/SAML y controles de seguridad empresarial.","flags":["has_soap_api_usage","has_saml_based_sso","has_uses_xml_signatures","has_uses_xml_encryption","has_proper_ws_security_headers","has_soap_message_level_encryption","has_soap_message_level_signatures","has_soap_prevents_replay_attacks","has_soap_validates_saml_token_audience","has_soap_validates_saml_token_expiry","has_soap_uses_strict_schema_validation","has_soap_masks_sensitive_data_in_logs"]},
            {"id":"HEALTH_EHR","title":"Health Domain & EHR","description":"Aspectos específicos de EHR y datos clínicos.","flags":["has_handles_patient_identifier_correctly","has_maps_patient_ids_consistently"]},
            {"id":"PATCHING","title":"Patching, Updates & Lifecycle","description":"Gestión de parches, eventos clínicos y ciclo de vida.","flags":["has_logs_clinically_relevant_events","has_tracks_clinician_user_actions"]},
            {"id":"ANDROID_EXTRA","title":"Extra Android / MobSF-derived","description":"Controles adicionales relacionados con clínica y flujo asistencial.","flags":["has_supports_ephi_access_auditing","has_supports_patient_access_to_audit_trail","has_ensures_data_integrity_for_clinical_records","has_supports_versioning_of_clinical_records","has_ensures_atomic_updates_to_clinical_records"]}
          ]
          JSON

          cat > "$config_dir/vision360.project.json" <<'JSON'
          {
            "source_label": "SOURCE_CODE_OPENMRS",
            "project": {"name": "OpenMRS Android Client"},
            "detectors": {
              "os_time_source": {"preferred_evidence": [], "preferred_path_hints": []},
              "password_hashing": {"preferred_path_hints": []},
              "logout_session": {"path_hints": []},
              "endpoint_auth": {"path_hints": []}
            },
            "flag_overrides": {
              "has_supports_manual_logout": {
                "state": "pass",
                "summary": "has_supports_manual_logout = YES",
                "notes": "Manual auditor determination. The application provides a user-accessible logout action.",
                "evidence": [
                  {
                    "source": "AUDIT_TEAM",
                    "path": "manual_assessment/logout_review",
                    "rule_id": "manual_override",
                    "excerpt": "The auditor verified a user-accessible logout action in the application flow."
                  }
                ],
                "evidence_count_override": 1
              }
            }
          }
          JSON

          python -m json.tool "$config_dir/vision360.defaults.yml" >/dev/null
          python -m json.tool "$config_dir/vision360.groups.json" >/dev/null
          python -m json.tool "$config_dir/vision360.project.json" >/dev/null

          {
            echo "VISION360_DEFAULTS=$config_dir/vision360.defaults.yml"
            echo "VISION360_GROUPS_FILE=$config_dir/vision360.groups.json"
            echo "VISION360_PROJECT_PARAMS=$config_dir/vision360.project.json"
          } >> "$GITHUB_ENV"

      - name: Download all artifacts from this workflow run
        uses: actions/download-artifact@v6
        with:
          path: _artifacts
          merge-multiple: true

      - name: Normalize inputs for VISION360 (build the 5 required ZIPs)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci_prepare_vision360_inputs.py --artifacts-dir _artifacts --out-dir /mnt/data
          ls -lah /mnt/data

      - name: Run VISION360 generator
        shell: bash
        run: |
          set -euo pipefail
          python scripts/vision360_generator.py

          python - <<'PY'
          import copy
          import json
          import zipfile
          from pathlib import Path

          out_dir = Path('/mnt/data')
          fp_path = out_dir / 'vision360_fingerprint.json'
          trace_path = out_dir / 'vision360_trace.json'
          trivy_zip = out_dir / 'trivy-payload.zip'

          def load_json(path, default):
              try:
                  if not path.is_file():
                      return copy.deepcopy(default)
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return copy.deepcopy(default)

          def load_zip_json(zip_path, member, default):
              try:
                  if not zip_path.is_file():
                      return copy.deepcopy(default)
                  with zipfile.ZipFile(zip_path, 'r') as zf:
                      raw = zf.read(member)
                  for enc in ('utf-8', 'cp1252', 'latin-1'):
                      try:
                          return json.loads(raw.decode(enc))
                      except Exception:
                          pass
              except Exception:
                  pass
              return copy.deepcopy(default)

          def sev(value):
              value = str(value or 'UNKNOWN').strip().upper()
              return value if value in {'CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN'} else 'UNKNOWN'

          def to_int(value, default=0):
              try:
                  return int(value) if value is not None else default
              except Exception:
                  return default

          def counter(items):
              out = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0, 'UNKNOWN': 0}
              for item in items:
                  out[sev(item.get('severity'))] += 1
              return out

          def best_cvss(raw):
              best = {'source': None, 'v3_score': None, 'v3_vector': None}
              best_score = -1.0
              if not isinstance(raw, dict):
                  return best
              for source, value in raw.items():
                  if not isinstance(value, dict):
                      continue
                  try:
                      score = float(value.get('V3Score') or 0)
                  except Exception:
                      score = 0.0
                  if score > best_score:
                      best_score = score
                      best = {'source': str(source), 'v3_score': score, 'v3_vector': value.get('V3Vector')}
              return best

          def norm_trace(item):
              vuln_id = item.get('id') or item.get('VulnerabilityID')
              fixed = item.get('fixed') or item.get('FixedVersion')
              return {
                  'cve': vuln_id,
                  'vulnerability_id': vuln_id,
                  'type': 'dependency_vulnerability',
                  'component': item.get('pkg') or item.get('PkgName'),
                  'package_id': item.get('pkg_id') or item.get('PkgID'),
                  'installed_version': item.get('installed') or item.get('InstalledVersion'),
                  'fixed_version': fixed,
                  'fix_available': bool(item.get('fix_available') or fixed),
                  'severity': sev(item.get('severity') or item.get('Severity')),
                  'severity_source': item.get('severity_source') or item.get('SeveritySource'),
                  'status': item.get('status') or item.get('Status'),
                  'cwe_ids': item.get('cwe') or item.get('CweIDs') or item.get('CWEIDs') or [],
                  'title': item.get('title') or item.get('Title'),
                  'description': item.get('description') or item.get('Description'),
                  'primary_url': item.get('primary_url') or item.get('PrimaryURL'),
                  'references': item.get('references') or item.get('References') or [],
                  'published_at': item.get('published') or item.get('PublishedDate'),
                  'last_modified_at': item.get('modified') or item.get('LastModifiedDate'),
                  'target': item.get('target') or item.get('Target'),
                  'source': 'TRIVY',
                  'artifact_source': 'vision360_trace.json:effective_features.sca.findings',
              }

          def norm_trivy(result, vuln):
              fixed = vuln.get('FixedVersion')
              return {
                  'cve': vuln.get('VulnerabilityID'),
                  'vulnerability_id': vuln.get('VulnerabilityID'),
                  'type': 'dependency_vulnerability',
                  'component': vuln.get('PkgName'),
                  'package_id': vuln.get('PkgID'),
                  'installed_version': vuln.get('InstalledVersion'),
                  'fixed_version': fixed,
                  'fix_available': bool(fixed),
                  'severity': sev(vuln.get('Severity')),
                  'severity_source': vuln.get('SeveritySource'),
                  'status': vuln.get('Status'),
                  'cwe_ids': vuln.get('CweIDs') or vuln.get('CWEIDs') or [],
                  'title': vuln.get('Title'),
                  'description': vuln.get('Description'),
                  'primary_url': vuln.get('PrimaryURL'),
                  'references': vuln.get('References') or [],
                  'published_at': vuln.get('PublishedDate'),
                  'last_modified_at': vuln.get('LastModifiedDate'),
                  'target': result.get('Target'),
                  'class': result.get('Class'),
                  'scanner_type': result.get('Type'),
                  'best_cvss': best_cvss(vuln.get('CVSS') or {}),
                  'data_source': vuln.get('DataSource') or {},
                  'source': 'TRIVY',
                  'artifact_source': 'trivy.json:Results[].Vulnerabilities[]',
              }

          def trivy_vulns():
              data = load_zip_json(trivy_zip, 'trivy.json', {})
              out = []
              if not isinstance(data, dict):
                  return out
              for result in data.get('Results') or []:
                  if not isinstance(result, dict):
                      continue
                  for vuln in result.get('Vulnerabilities') or []:
                      if isinstance(vuln, dict):
                          out.append(norm_trivy(result, vuln))
              return out

          def dedupe(items):
              seen = set()
              out = []
              for item in items:
                  key = (str(item.get('vulnerability_id') or ''), str(item.get('component') or ''), str(item.get('installed_version') or ''), str(item.get('target') or ''))
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(item)
              return out

          fp = load_json(fp_path, {})
          trace = load_json(trace_path, {})
          if isinstance(fp, dict) and fp:
              features = trace.get('effective_features') if isinstance(trace, dict) else {}
              sca = (features or {}).get('sca') if isinstance(features, dict) else {}
              sca = sca if isinstance(sca, dict) else {}
              findings = sca.get('findings') if isinstance(sca.get('findings'), list) else []
              vulns = dedupe([norm_trace(x) for x in findings if isinstance(x, dict)] + trivy_vulns())
              fixable = [x for x in vulns if x.get('fix_available')]
              unfixed = [x for x in vulns if not x.get('fix_available')]
              packages = sca.get('packages') if isinstance(sca.get('packages'), list) else []
              licenses = sca.get('licenses') if isinstance(sca.get('licenses'), list) else []
              project = fp.get('project') if isinstance(fp.get('project'), dict) else {}
              fp['technical_details'] = {
                  'schema_version': 1,
                  'execution': {
                      'generated_at': project.get('generated_at') or trace.get('generated_at'),
                      'source_manifest_path': trace.get('source_manifest_path'),
                      'source_zip_name': trace.get('source_zip_name'),
                      'source_label': trace.get('source_label'),
                      'declared_sources': project.get('sources') or [],
                  },
                  'sca': {
                      'source': 'TRIVY',
                      'artifact_sources': ['trivy-payload.zip/trivy.json', 'trivy-payload.zip/agent_payload.json', 'vision360_trace.json:effective_features.sca'],
                      'summary': {
                          'total_vulnerabilities': to_int(sca.get('total_vulnerabilities'), len(vulns)),
                          'by_severity': sca.get('by_severity') if isinstance(sca.get('by_severity'), dict) else counter(vulns),
                          'fixable_total': to_int(sca.get('fixable_total'), len(fixable)),
                          'fixable_by_severity': sca.get('fixable_by_severity') if isinstance(sca.get('fixable_by_severity'), dict) else counter(fixable),
                          'unfixed_total': to_int(sca.get('unfixed_total'), len(unfixed)),
                          'packages_detected': to_int(sca.get('packages_detected'), len(packages)),
                          'license_entries_detected': to_int(sca.get('license_entries_detected'), len(licenses)),
                      },
                      'vulnerabilities': vulns,
                      'packages': packages[:100],
                      'licenses': licenses[:100],
                  },
              }
              fp_path.write_text(json.dumps(fp, indent=2, ensure_ascii=False), encoding='utf-8')
          PY

      - name: Validate VISION360 outputs
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            /mnt/data/vision360_fingerprint.json \
            /mnt/data/vision360_output.json \
            /mnt/data/vision360_trace.json \
            /mnt/data/vision360_effective_config.json
          do
            test -f "$file"
          done

          echo "[OK] VISION360 direct JSON outputs were generated:"
          ls -lah \
            /mnt/data/vision360_fingerprint.json \
            /mnt/data/vision360_output.json \
            /mnt/data/vision360_trace.json \
            /mnt/data/vision360_effective_config.json

      - name: Prepare VISION360 publish artifact
        shell: bash
        run: |
          set -euo pipefail

          publish_dir="/mnt/data/artifact_publish/vision360-bundle"
          evidence_dir="$publish_dir/evidence-inputs"
          mkdir -p "$publish_dir" "$evidence_dir"

          test -f /mnt/data/vision360_fingerprint.json
          test -f /mnt/data/vision360_output.json
          test -f /mnt/data/vision360_trace.json
          test -f /mnt/data/vision360_effective_config.json

          cp /mnt/data/vision360_fingerprint.json "$publish_dir/vision360_fingerprint.json"
          cp /mnt/data/vision360_output.json "$publish_dir/vision_360_output.json"
          cp /mnt/data/vision360_trace.json "$publish_dir/vision360_trace.json"
          cp /mnt/data/vision360_effective_config.json "$publish_dir/vision360_effective_config.json"

          # Keep the normalized scanner inputs with the bundle for audit traceability.
          # This prevents later reviews from depending only on the flattened fingerprint.
          for artifact in \
            mobsf-report.zip \
            mobsf-dynamic-report.zip \
            sast-findings.zip \
            trivy-payload.zip \
            openMRS.zip
          do
            if [ -f "/mnt/data/$artifact" ]; then
              cp "/mnt/data/$artifact" "$evidence_dir/$artifact"
            else
              echo "[WARN] normalized input not found for publish bundle: $artifact"
            fi
          done

          test -f "$publish_dir/vision360_fingerprint.json"
          test -f "$publish_dir/vision_360_output.json"
          test -f "$publish_dir/vision360_trace.json"
          test -f "$publish_dir/vision360_effective_config.json"

          echo "[ARTIFACT] vision360-bundle will publish:"
          find "$publish_dir" -maxdepth 3 -type f -print -exec ls -lh {} \;

      - name: Upload VISION360 outputs
        uses: actions/upload-artifact@v6
        with:
          name: vision360-bundle
          if-no-files-found: error
          path: |
            /mnt/data/artifact_publish/vision360-bundle/vision360_fingerprint.json
            /mnt/data/artifact_publish/vision360-bundle/vision_360_output.json
            /mnt/data/artifact_publish/vision360-bundle/vision360_trace.json
            /mnt/data/artifact_publish/vision360-bundle/vision360_effective_config.json
            /mnt/data/artifact_publish/vision360-bundle/evidence-inputs/*.zip
