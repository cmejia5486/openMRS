name: Package Source Zip (app-zip.zip)

on:
workflow_call:

permissions:
contents: read
actions: write

jobs:
package_source_zip:
name: Zipped code source (app-zip.zip)
runs-on: ubuntu-latest
timeout-minutes: 20

steps:
  - name: Checkout repository
    uses: actions/checkout@v6
    with:
      fetch-depth: 0

  - name: Create app-zip.zip (exclude git metadata)
    shell: bash
    run: |
      set -euo pipefail
      rm -f app-zip.zip
      zip -r app-zip.zip . -x ".git/*" ".git/**"

  - name: Upload app-zip artifact
    uses: actions/upload-artifact@v6
    with:
      name: app-zip
      path: app-zip.zip
      if-no-files-found: error