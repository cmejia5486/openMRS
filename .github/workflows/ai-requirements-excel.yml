      - name: Run AI audit on Windows
        if: runner.os == 'Windows'
        env:
          USE_OPENAI_JUSTIFICATIONS: "1"
          STRICT_ENGLISH_OUTPUT: "1"
          PYTHONNOUSERSITE: "1"
          PYTHONUNBUFFERED: "1"
          AI_RUNTIME_DEBUG: ${{ vars.AI_RUNTIME_DEBUG }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & $env:PYTHON_EXE scripts/ai_security_audit_requirements_excel.py
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (-not (Test-Path $env:SECURITY_AUDIT_XLSX_PATH)) {
            throw "security_audit_requirements.xlsx was not created at $env:SECURITY_AUDIT_XLSX_PATH"
          }
          if (-not (Test-Path $env:RUN_METRICS_XLSX_PATH)) {
            throw "run-metrics.xlsx was not created at $env:RUN_METRICS_XLSX_PATH"
          }

      - name: Run AI audit on Unix
        if: runner.os != 'Windows'
        env:
          USE_OPENAI_JUSTIFICATIONS: "1"
          STRICT_ENGLISH_OUTPUT: "1"
          PYTHONNOUSERSITE: "1"
          PYTHONUNBUFFERED: "1"
          AI_RUNTIME_DEBUG: ${{ vars.AI_RUNTIME_DEBUG }}
        shell: bash
        run: |
          set -euo pipefail

          "$PYTHON_EXE" scripts/ai_security_audit_requirements_excel.py
          test -f "$SECURITY_AUDIT_XLSX_PATH"
          test -f "$RUN_METRICS_XLSX_PATH"

      - name: Build run metrics package on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & $env:PYTHON_EXE scripts/build_run_metrics_package.py `
            --raw-metrics $env:RUN_METRICS_XLSX_PATH `
            --out-dir $env:RUN_METRICS_PACKAGE_DIR `
            --prompt-telemetry $env:PROMPT_TELEMETRY_PATH
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (-not (Test-Path (Join-Path $env:RUN_METRICS_PACKAGE_DIR "run-metrics.xlsx"))) {
            throw "run-metrics.xlsx was not prepared in $env:RUN_METRICS_PACKAGE_DIR"
          }
          if (-not (Test-Path (Join-Path $env:RUN_METRICS_PACKAGE_DIR "run-metrics-methodology.pdf"))) {
            throw "run-metrics-methodology.pdf was not prepared in $env:RUN_METRICS_PACKAGE_DIR"
          }

      - name: Build run metrics package on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          "$PYTHON_EXE" scripts/build_run_metrics_package.py \
            --raw-metrics "$RUN_METRICS_XLSX_PATH" \
            --out-dir "$RUN_METRICS_PACKAGE_DIR" \
            --prompt-telemetry "$PROMPT_TELEMETRY_PATH"
          test -f "$RUN_METRICS_PACKAGE_DIR/run-metrics.xlsx"
          test -f "$RUN_METRICS_PACKAGE_DIR/run-metrics-methodology.pdf"

      - name: Upload Excel output
        uses: actions/upload-artifact@v6
        with:
          name: security-audit-excel
          if-no-files-found: error
          path: ${{ runner.temp }}/vision360-data/security_audit_requirements.xlsx

      - name: Upload run metrics package
        uses: actions/upload-artifact@v6
        with:
          name: run-metrics
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/vision360-data/run-metrics/run-metrics.xlsx
            ${{ runner.temp }}/vision360-data/run-metrics/run-metrics-methodology.pdf
            ${{ runner.temp }}/vision360-data/prompt-telemetry.jsonl
