name = "chartlite-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Routes: api.chartlite.health/* handled by this Worker
# The main website (chartlite.health) continues to deploy as Cloudflare Pages or static assets separately.
#
# Deploy: cd worker && npx wrangler deploy
# Secrets (run each once):
#   npx wrangler secret put DEVICE_ENROLLMENT_SECRET      # One-time enrollment code for non-GMS device onboarding
#   npx wrangler secret put SESSION_SIGNING_SECRET        # JWT signing key (server-only — NEVER in APK)
#   npx wrangler secret put GOOGLE_SERVICE_ACCOUNT_KEY    # Google SA JSON key for Play Integrity (auto-refreshes tokens)
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put DEEPGRAM_API_KEY
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY

[[durable_objects.bindings]]
name = "DEVICE_AUTH"
class_name = "DeviceAuthState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceAuthState"]

[[kv_namespaces]]
binding = "ENROLLMENT_CODES"
id = "13996500262345578e1e5ba35cac5f69"

[vars]
ENVIRONMENT = "production"

# Custom domain — set up in Cloudflare dashboard:
# Workers & Pages → chartlite-api → Settings → Domains & Routes → Add Custom Domain → api.chartlite.health
# Or use workers.dev subdomain for testing:
# routes = [{ pattern = "api.chartlite.health/*", zone_name = "chartlite.health" }]
